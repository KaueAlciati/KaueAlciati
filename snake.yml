name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"     # roda 1x por dia (00:00 UTC)
  workflow_dispatch:         # permite rodar manualmente na aba Actions

permissions:
  contents: write            # <== necessário pra publicar no branch "output"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar SVGs (Platane/snk)
        uses: Platane/snk@v3
        with:
          github_user_name: KaueAlciati
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar no branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
